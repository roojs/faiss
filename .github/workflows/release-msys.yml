name: ROOJS - Release MSYS2

# Tag pushes publish a temporary GitHub Release named vX.Y.Z-win32 with the
# UCRT64 pacman package. A tag that already ends in -win32 is that release.
# workflow_dispatch with a tag input does the same from main, which is how
# the upstream watch starts a release.

on:
  push:
    tags:
      - 'v*-win32'
  workflow_dispatch:
    inputs:
      tag:
        description: Source tag to publish, for example v1.16.0
        required: false
        type: string
        default: ''

run-name: ROOJS - Release MSYS2 - ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-windows:
    name: MSYS2 UCRT64 package
    uses: ./.github/workflows/x-windows.yml
    with:
      pkgver: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: read

  publish:
    name: Publish -win32 release
    needs: build-windows
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-win'))
      || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: faiss-msys2
          path: artifacts

      - name: Publish temporary -win32 release
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.pkg.tar.zst)
          ((${#files[@]})) || {
            echo "no MSYS2 package to publish" >&2
            exit 1
          }
          src="${SRC_TAG#refs/tags/}"
          case "${src}" in
            v*) ;;
            *)
              echo "not a version tag: ${src}" >&2
              exit 1
              ;;
          esac
          base="${src%-win32}"
          base="${base%-win}"
          rel="${base}-win32"
          notes="$(mktemp)"
          {
            echo "Temporary MSYS2 UCRT64 build of Faiss ${base} for OLLMchat."
            echo
            echo "Install in a UCRT64 shell:"
            echo
            echo '```'
            echo "pacman -U --noconfirm mingw-w64-ucrt-x86_64-faiss-*-any.pkg.tar.zst"
            echo '```'
          } > "${notes}"
          ls -lh "${files[@]}"
          # The git tag already exists: this workflow only runs from that tag.
          # Do not pass --target. The Releases API then tries to create the tag
          # from a SHA, and a SHA that changes .github/workflows requires the
          # workflows scope. GITHUB_TOKEN cannot hold that scope, so the call
          # returns 403 even with contents: write.
          gh release create "${rel}" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${rel}" \
            --notes-file "${notes}" \
            --prerelease \
            --latest=false \
          || {
            gh release upload "${rel}" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "${rel}" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "${notes}" \
              --prerelease \
              --latest=false
          }
