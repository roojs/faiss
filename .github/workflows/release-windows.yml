name: ROOJS - Release Windows

# Manual MSYS2 package build. Pushes to main do not start this.
# The package release runs only from a v*-win32 tag (release-msys.yml).

on:
  workflow_dispatch:

run-name: ROOJS - Release Windows - ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build-windows:
    name: MSYS2 UCRT64 package
    uses: ./.github/workflows/x-windows.yml
