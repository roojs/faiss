name: ROOJS - Release Windows

# Manual MSYS2 package build. This is the workflow to run by hand.
# A tagged -win release is ROOJS - Release MSYS2 (release-msys.yml).

on:
  workflow_dispatch:
  # Push to main starts the same package build. workflow_dispatch is blocked
  # for this token, and this is how a packaging fix is checked.
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-windows.yml
      - .github/workflows/x-windows.yml
      - packaging/msys2/**
      - scripts/ci/**

run-name: ROOJS - Release Windows - ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build-windows:
    name: MSYS2 UCRT64 package
    uses: ./.github/workflows/x-windows.yml
