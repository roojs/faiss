name: ROOJS - Release Windows

# Manual MSYS2 package build. This is the workflow to run by hand.
# A tagged -win release is ROOJS - Release MSYS2 (release-msys.yml).

on:
  workflow_dispatch:

run-name: ROOJS - Release Windows - ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build-windows:
    name: MSYS2 UCRT64 package
    uses: ./.github/workflows/x-windows.yml
